name: upstream-watch

# Weekly: are the pinned upstreams behind? (docs/UPSTREAM-SOURCES.md)
# Fails, and so notifies the repository's watchers, when ungoogled-chromium or an overlay has
# a newer tag than UPSTREAM pins, or when Clearcote changed its public patches/ since the
# vendored commit. The job summary has the full table, including the reference repos.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare pins with upstream
        run: |
          set -o pipefail
          tools/upstream_watch.py --strict --json upstream.json | tee upstream.txt
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat upstream.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-watch
          path: upstream.json
